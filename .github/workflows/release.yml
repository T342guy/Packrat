name: Pipeline

# One run per push does everything: check, benchmark, work out the version,
# build, publish the release, then push the images. Nothing is published
# unless the checks passed, and the release notes carry the benchmark
# comparison against the previous release.
#
# What a run publishes depends on where it came from:
#
#   main, pushed        pre-release  0.1.4-pre1-2026.aug.22
#   main, dispatched    production   0.1.4-2026.aug.22
#   dev, pushed         pre-release  0.1.4-dev1-2026.aug.22
#   a pull request      pre-release  0.1.4-claude.1-2026.aug.22
#   anything else       built and checked, nothing published
#
# scripts/release-plan.sh holds those rules and is tested directly.

on:
  push:
    # Every branch, so checks and benchmarks run wherever work happens.
    # What each branch publishes is decided by scripts/release-plan.sh.
  pull_request:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Production release (main only), or a pre-release on this branch's channel"
        type: choice
        options: [production, prerelease]
        default: production
      bump:
        description: "Which part of the version to raise"
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: write
  packages: write
  # So a push can find the open pull request its branch belongs to, and name
  # the pre-release channel after whoever opened it.
  pull-requests: read

concurrency:
  # Runs on the two release branches queue up behind each other rather than
  # cancelling, so a publish is never interrupted half way. Feature branches
  # supersede themselves, so a flurry of pushes does not tie up the runners.
  group: pipeline-${{ github.ref }}
  cancel-in-progress: >-
    ${{ !contains(fromJSON('["refs/heads/main", "refs/heads/master",
                             "refs/heads/dev", "refs/heads/Dev"]'), github.ref) }}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Work out the version
    # The version bump commits back to main; without the guard it would
    # trigger itself. A pull request from this same repository is already
    # covered by its branch's push run, so skip the duplicate.
    if: |
      !contains(github.event.head_commit.message, '[skip ci]')
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        name: Choose the version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # "A pull request branch" means one with an open pull request, and
          # the channel is named after whoever opened it. On a push there is
          # no PR in the event payload, so ask for it.
          pr_author="$PR_USER"
          if [[ -z "$pr_author" && "$EVENT" == "push" ]]; then
            pr_author="$(gh pr list --head "$BRANCH" --state open \
                           --json author --jq '.[0].author.login' 2>/dev/null || true)"
          fi

          plan="$(scripts/release-plan.sh \
                    --event "$EVENT" --branch "$BRANCH" --actor "$ACTOR" \
                    --pr-author "$pr_author" \
                    --release-type "$RELEASE_TYPE" --bump "$BUMP")"
          echo "$plan"

          field() { grep -m1 "^$1=" <<< "$plan" | cut -d= -f2-; }
          publish="$(field publish)"
          prerelease="$(field prerelease)"
          channel="$(field channel)"
          bump="$(field bump)"

          if [[ "$publish" == "true" ]]; then
            if [[ -n "$channel" ]]; then
              version="$(scripts/next-version.sh "$bump" --channel "$channel")"
            else
              version="$(scripts/next-version.sh "$bump")"
            fi
          else
            # Nothing is tagged, but the build still stamps something so the
            # archives and the image carry a coherent version.
            version="$(scripts/next-version.sh none)"
          fi

          {
            echo "version=$version"
            echo "tag=v$version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"
          if [[ "$publish" != "true" ]]; then
            echo "::notice::${version} — built and checked, nothing published"
          elif [[ -n "$channel" ]]; then
            echo "::notice::${version} — pre-release on the ${channel} channel"
          else
            echo "::notice::${version} — production release"
          fi

  checks:
    name: Format, lint and test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Shell scripts
        # The release machinery is bash now, so it gets linted like the rest —
        # including the bash that lives inside this very workflow.
        run: |
          shellcheck --severity=warning scripts/*.sh
          ./scripts/lint-workflows.sh

      - name: Release tooling
        # The version arithmetic and the benchmark verdict both decide what
        # ships, so they are tested rather than trusted.
        run: |
          ./scripts/test-next-version.sh
          ./scripts/test-bench-tools.sh
          ./scripts/test-release-commit.sh

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Smoke test the binary
        run: |
          set -euo pipefail
          ./target/release/packrat --db "$RUNNER_TEMP/ci.db" --port 8099 --seed-example &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8099/api/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8099/api/health
          # The seeded inventory should be queryable end to end.
          curl -fsS "http://127.0.0.1:8099/api/search?q=tent" | grep -q "4-person tent"
          # And a label sheet should render, QR codes and all.
          curl -fsS "http://127.0.0.1:8099/labels?format=dymo-30334&symbols=both" | grep -q "<svg"
          echo "smoke test passed"

      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          if [[ "$STATUS" == "success" ]]; then
            echo "### ✅ Checks passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Checks failed" >> "$GITHUB_STEP_SUMMARY"
          fi

  bench:
    name: Benchmarks
    needs: prepare
    # Runner timings are too noisy to gate a release on, so a blow-up here is
    # reported rather than fatal. It still runs on every branch: a regression
    # is worth knowing about while the change is in progress.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run the benchmarks
        run: cargo bench --bench inventory -- --warm-up-time 0.3 --measurement-time 1.0

      - name: Collect the numbers
        run: |
          ./scripts/bench-report.sh \
            --version "${{ needs.prepare.outputs.version }}" \
            --out benchmarks.json

      - name: Fetch the previous release's numbers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Walk back through published releases until one carries a report.
          # Early releases predate this file, and a release can be cut without
          # one if the bench job failed that day.
          for tag in $(gh release list --limit 20 --exclude-drafts \
                         --json tagName --jq '.[].tagName' 2>/dev/null || true); do
            if gh release download "$tag" --pattern benchmarks.json \
                 --output previous.json 2>/dev/null; then
              echo "comparing against $tag"
              exit 0
            fi
          done
          echo "no previous benchmark report found — this run becomes the baseline"

      - name: Compare against the previous release
        run: |
          set -euo pipefail
          # An `x && y=z` here would abort the step under `set -e` whenever
          # there is no baseline, which is exactly the first-release case.
          baseline=""
          if [[ -f previous.json ]]; then baseline=previous.json; fi
          ./scripts/bench-compare.sh "$baseline" benchmarks.json > bench-summary.md
          cat bench-summary.md
          cat bench-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            benchmarks.json
            bench-summary.md
          retention-days: 30

  build:
    name: ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl toolchain
        # Statically linked, so one binary runs on any Linux of that
        # architecture regardless of its glibc.
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Stamp the version
        # No-op on a real release, where the tag already carries the bump.
        run: scripts/stamp-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="packrat-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/packrat" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp scripts/install.sh "dist/$name/"
          chmod +x "dist/$name/packrat" "dist/$name/install.sh"

          cd dist
          tar -czf "${name}.tar.gz" "$name"
          zip -qr "${name}.zip" "$name"
          ls -lh "${name}.tar.gz" "${name}.zip"

      - name: Check the binary runs
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # The archive name, the git tag, the image tag and what the binary
          # says about itself all have to agree, so assert it rather than hope.
          reported="$(./target/${{ matrix.target }}/release/packrat --version | head -1)"
          echo "$reported"
          if [[ "$reported" != "packrat $VERSION" ]]; then
            echo "binary reports '$reported', expected 'packrat $VERSION'" >&2
            exit 1
          fi
          ./target/${{ matrix.target }}/release/packrat --db "$RUNNER_TEMP/rel.db" --port 8123 &
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8123/api/health > /dev/null 2>&1 && break
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8123/api/health

      - uses: actions/upload-artifact@v4
        with:
          name: packrat-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 7

  publish:
    name: Publish the release
    # Checks gate the release; benchmarks only inform it, which is why bench
    # is continue-on-error rather than a dependency that can block.
    needs: [prepare, checks, bench, build]
    # Spelled out rather than left to `needs`: benchmarks inform the release,
    # they do not gate it, so `bench` is absent from the condition on purpose.
    if: |
      always()
      && needs.prepare.outputs.publish == 'true'
      && needs.checks.result == 'success'
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump, commit and tag
        # Deliberately here and not in `prepare`: the version is only spent,
        # and the tag only created, once the checks and every build have
        # passed. A failing run leaves no dangling tag and burns no number.
        #
        # The logic lives in a script rather than here because the version it
        # replaced was shell inside this file that nothing executed until a
        # real release ran — which is how it shipped pushing the tag without
        # the branch. scripts/test-release-commit.sh runs it against a real
        # git remote instead.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          scripts/release-commit.sh \
            --version "$VERSION" --tag "$TAG" \
            --channel "$CHANNEL" --branch "$BRANCH"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [[ -n "$previous" ]]; then
            range="${previous}..${TAG}"
            heading="Changes since ${previous}"
          else
            range="$TAG"
            heading="Everything so far"
          fi

          {
            if [[ "$PRERELEASE" == "true" ]]; then
              case "$CHANNEL" in
                pre) origin='cut automatically from `main`' ;;
                dev) origin='cut automatically from the `dev` branch' ;;
                *)   origin="cut from a pull request by \`${CHANNEL}\`" ;;
              esac
              echo "**Pre-release** on the \`${CHANNEL}\` channel, ${origin}."
              echo "Packrat ${VERSION}, built $(date -u '+%d %B %Y')."
              echo
              echo 'It does not change what the next production release will be numbered —'
              echo 'that simply drops the channel part — and the `latest` container tag'
              echo 'still points at the last production release.'
            else
              echo "Packrat ${VERSION}, built $(date -u '+%d %B %Y')."
            fi
            echo
            echo "## ${heading}"
            echo
            git log --no-merges --pretty='- %s (`%h`)' "$range"
            echo

            if [[ -f artifacts/bench-summary.md ]]; then
              # bench-report writes an H3; the release notes want an H2.
              sed 's/^### /## /' artifacts/bench-summary.md
              echo
            fi

            echo "## Install"
            echo
            echo 'Download the archive for your architecture, unpack it, and either run the'
            echo 'binary directly or let the bundled installer register it to start at boot:'
            echo
            echo '```bash'
            echo "tar xzf packrat-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
            echo "cd packrat-${VERSION}-x86_64-unknown-linux-musl"
            echo './packrat --seed-example          # try it'
            echo 'sudo ./install.sh --binary ./packrat   # or install it properly'
            echo '```'
            echo
            echo 'The binaries are statically linked, so they run on any Linux of that'
            echo 'architecture. The container image for this exact version is'
            echo "\`ghcr.io/t342guy/packrat:${VERSION}\`."
            echo
            echo "## Checksums"
            echo
            echo '```'
            (cd artifacts && sha256sum ./*.tar.gz ./*.zip | sed 's|\./||')
            echo '```'
          } > notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          assets=(artifacts/*.tar.gz artifacts/*.zip)
          # Attached so the next release can compare itself against this one.
          if [[ -f artifacts/benchmarks.json ]]; then
            assets+=(artifacts/benchmarks.json)
          fi

          flags=(--title "Packrat $VERSION" --notes-file notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then
            # Keeps it out of "latest release" and off the repository header.
            flags+=(--prerelease)
          fi

          gh release create "$TAG" "${flags[@]}" "${assets[@]}"

          url="$(gh release view "$TAG" --json url --jq .url)"
          {
            if [[ "$PRERELEASE" == "true" ]]; then
              echo "### 🧪 Pre-release [$VERSION]($url) on the \`$CHANNEL\` channel"
            else
              echo "### 🚀 Released [$VERSION]($url)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Repeat the benchmark verdict
        if: hashFiles('artifacts/bench-summary.md') != ''
        run: cat artifacts/bench-summary.md >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Container image
    # Last, so a published image always corresponds to a release that exists.
    # `always()` lets this run on branch builds, where publish is skipped
    # rather than successful — there it validates the Dockerfile without
    # pushing anything.
    needs: [prepare, checks, build, publish]
    if: |
      always()
      && needs.prepare.result == 'success'
      && needs.checks.result == 'success'
      && needs.build.result == 'success'
      && needs.publish.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image name
        # GHCR requires a lowercase image path; the repository name may not be.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Stamp the version
        # So the binary inside the image reports the same version as the
        # release it was cut from, on branch builds as well as releases.
        run: scripts/stamp-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Work out the image tags
        # `latest` means the current production release and nothing else, so
        # neither a branch build nor any pre-release channel moves it. The two
        # standing channels get a moving tag of their own instead; a
        # contributor's channel gets only its exact version.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          tags="${IMAGE}:${VERSION}"
          if [[ "$PUBLISH" == "true" ]]; then
            if [[ "$PRERELEASE" != "true" ]]; then
              tags="${tags}"$'\n'"${IMAGE}:latest"
            elif [[ "$CHANNEL" == "pre" ]]; then
              tags="${tags}"$'\n'"${IMAGE}:prerelease"
            elif [[ "$CHANNEL" == "dev" ]]; then
              tags="${tags}"$'\n'"${IMAGE}:dev"
            fi
          fi
          {
            echo "TAGS<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # x86-64 only, and deliberately. Adding linux/arm64 here means
          # building it under QEMU, which took this job from three minutes to
          # twenty-five — a poor trade for a platform almost nobody runs this
          # on. Release archives still carry an arm64 binary, because those
          # build natively and cost nothing.
          platforms: linux/amd64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          {
            if [[ "$PUBLISH" == "true" ]]; then
              echo "### 📦 Image pushed"
              echo
              echo '```'
              echo "${TAGS}"
              echo '```'
            else
              echo "### 📦 Image built, not pushed (branch build)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
