name: Release

on:
  push:
    # Every merge to main cuts a release. Other branches build and package the
    # artifacts without publishing, so the pipeline can be exercised safely.
    branches: [main, "claude/**"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise"
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Work out the version
    # The version bump commits back to main; without this it would trigger
    # itself. GitHub also honours [skip ci] natively — belt and braces.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        name: Choose the version
        run: |
          set -euo pipefail
          publish=false
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            publish=true
          fi
          bump="${{ inputs.bump }}"
          [[ -n "$bump" ]] || bump=patch
          # A dry build must not pretend to raise the version.
          [[ "$publish" == "true" ]] || bump=none

          version="$(scripts/next-version.sh "$bump")"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::${bump} bump -> ${version} (publish: ${publish})"

      - name: Bump, commit and tag
        if: steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
          # Rewrites the packrat entry in Cargo.lock so --locked builds work.
          cargo metadata --format-version 1 > /dev/null
          locked="$(grep -A1 'name = "packrat"' Cargo.lock | grep '^version' | cut -d'"' -f2)"
          [[ "$locked" == "$VERSION" ]] || {
            echo "Cargo.lock still says $locked, expected $VERSION" >&2
            exit 1
          }

          git add Cargo.toml Cargo.lock
          git commit -m "Release $VERSION [skip ci]"
          git tag -a "$TAG" -m "Packrat $VERSION"
          git push origin HEAD "$TAG"

  build:
    name: ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.tag || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl toolchain
        # Statically linked, so one binary runs on any Linux of that
        # architecture regardless of its glibc.
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="packrat-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/packrat" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp scripts/install.sh "dist/$name/"
          chmod +x "dist/$name/packrat" "dist/$name/install.sh"

          cd dist
          tar -czf "${name}.tar.gz" "$name"
          zip -qr "${name}.zip" "$name"
          ls -lh "${name}.tar.gz" "${name}.zip"

      - name: Check the binary runs
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          ./target/${{ matrix.target }}/release/packrat --version
          ./target/${{ matrix.target }}/release/packrat --db "$RUNNER_TEMP/rel.db" --port 8123 &
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8123/api/health > /dev/null 2>&1 && break
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8123/api/health

      - uses: actions/upload-artifact@v4
        with:
          name: packrat-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 7

  publish:
    name: Publish the release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [[ -n "$previous" ]]; then
            range="${previous}..${TAG}"
            heading="Changes since ${previous}"
          else
            range="$TAG"
            heading="Everything so far"
          fi

          {
            echo "Packrat ${VERSION}, built $(date -u '+%d %B %Y')."
            echo
            echo "## ${heading}"
            echo
            git log --no-merges --pretty='- %s (`%h`)' "$range"
            echo
            echo "## Install"
            echo
            echo 'Download the archive for your architecture, unpack it, and either run the'
            echo 'binary directly or let the bundled installer register it to start at boot:'
            echo
            echo '```bash'
            echo "tar xzf packrat-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
            echo "cd packrat-${VERSION}-x86_64-unknown-linux-musl"
            echo './packrat --seed-example          # try it'
            echo 'sudo ./install.sh --binary ./packrat   # or install it properly'
            echo '```'
            echo
            echo 'The binaries are statically linked, so they run on any Linux of that'
            echo 'architecture. A container image for the same version is at'
            echo "\`ghcr.io/t342guy/packrat:${VERSION}\`."
            echo
            echo "## Checksums"
            echo
            echo '```'
            (cd artifacts && sha256sum ./*.tar.gz ./*.zip | sed 's|\./||')
            echo '```'
          } > notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "Packrat $VERSION" \
            --notes-file notes.md \
            artifacts/*.tar.gz artifacts/*.zip
          echo "### Released [$VERSION]($(gh release view "$TAG" --json url --jq .url))" \
            >> "$GITHUB_STEP_SUMMARY"
