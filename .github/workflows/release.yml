name: Release

on:
  push:
    # Every merge to main cuts a release. Other branches run the same build,
    # packaging and image build without publishing anything, so the pipeline
    # can be exercised safely.
    branches: [main, "claude/**"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise"
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Work out the version
    # The version bump commits back to main; without this it would trigger
    # itself. GitHub also honours [skip ci] natively — belt and braces.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        name: Choose the version
        run: |
          set -euo pipefail
          publish=false
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            publish=true
          fi
          bump="${{ inputs.bump }}"
          [[ -n "$bump" ]] || bump=patch
          # A dry build must not pretend to raise the version.
          [[ "$publish" == "true" ]] || bump=none

          version="$(scripts/next-version.sh "$bump")"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          # Everything downstream builds this exact commit, so the binaries,
          # the archives and the image are all the same code.
          if [[ "$publish" == "true" ]]; then
            echo "ref=v$version" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice::${bump} bump -> ${version} (publish: ${publish})"

      - name: Bump, commit and tag
        if: steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/stamp-version.sh "$VERSION"
          git add Cargo.toml Cargo.lock
          git commit -m "Release $VERSION [skip ci]"
          git tag -a "$TAG" -m "Packrat $VERSION"
          git push origin HEAD "$TAG"

  build:
    name: ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl toolchain
        # Statically linked, so one binary runs on any Linux of that
        # architecture regardless of its glibc.
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Stamp the version
        # No-op on a real release, where the tag already carries the bump.
        run: scripts/stamp-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="packrat-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/packrat" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp scripts/install.sh "dist/$name/"
          chmod +x "dist/$name/packrat" "dist/$name/install.sh"

          cd dist
          tar -czf "${name}.tar.gz" "$name"
          zip -qr "${name}.zip" "$name"
          ls -lh "${name}.tar.gz" "${name}.zip"

      - name: Check the binary runs
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # The archive name, the git tag, the image tag and what the binary
          # says about itself all have to agree, so assert it rather than hope.
          reported="$(./target/${{ matrix.target }}/release/packrat --version | head -1)"
          echo "$reported"
          if [[ "$reported" != "packrat $VERSION" ]]; then
            echo "binary reports '$reported', expected 'packrat $VERSION'" >&2
            exit 1
          fi
          ./target/${{ matrix.target }}/release/packrat --db "$RUNNER_TEMP/rel.db" --port 8123 &
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8123/api/health > /dev/null 2>&1 && break
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8123/api/health

      - uses: actions/upload-artifact@v4
        with:
          name: packrat-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 7

  publish:
    name: Publish the release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [[ -n "$previous" ]]; then
            range="${previous}..${TAG}"
            heading="Changes since ${previous}"
          else
            range="$TAG"
            heading="Everything so far"
          fi

          {
            echo "Packrat ${VERSION}, built $(date -u '+%d %B %Y')."
            echo
            echo "## ${heading}"
            echo
            git log --no-merges --pretty='- %s (`%h`)' "$range"
            echo
            echo "## Install"
            echo
            echo 'Download the archive for your architecture, unpack it, and either run the'
            echo 'binary directly or let the bundled installer register it to start at boot:'
            echo
            echo '```bash'
            echo "tar xzf packrat-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
            echo "cd packrat-${VERSION}-x86_64-unknown-linux-musl"
            echo './packrat --seed-example          # try it'
            echo 'sudo ./install.sh --binary ./packrat   # or install it properly'
            echo '```'
            echo
            echo 'The binaries are statically linked, so they run on any Linux of that'
            echo 'architecture. The container image for this exact version is'
            echo "\`ghcr.io/t342guy/packrat:${VERSION}\`."
            echo
            echo "## Checksums"
            echo
            echo '```'
            (cd artifacts && sha256sum ./*.tar.gz ./*.zip | sed 's|\./||')
            echo '```'
          } > notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "Packrat $VERSION" \
            --notes-file notes.md \
            artifacts/*.tar.gz artifacts/*.zip
          echo "### Released [$VERSION]($(gh release view "$TAG" --json url --jq .url))" \
            >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Container image
    # Last, so a published image always corresponds to a release that exists.
    # `always()` lets this run on branch builds, where publish is skipped
    # rather than successful — there it validates the Dockerfile without
    # pushing anything.
    needs: [prepare, build, publish]
    if: |
      always()
      && needs.prepare.result == 'success'
      && needs.build.result == 'success'
      && needs.publish.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Work out the image name
        # GHCR requires a lowercase image path; the repository name may not be.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Stamp the version
        # So the binary inside the image reports the same version as the
        # release it was cut from, on branch builds as well as releases.
        run: scripts/stamp-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Work out the image tags
        # `latest` should only ever mean "the current main", so a manual run
        # from a branch tags the version and nothing else.
        run: |
          set -euo pipefail
          tags="${IMAGE}:${{ needs.prepare.outputs.version }}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "TAGS<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # x86-64 only, and deliberately. Adding linux/arm64 here means
          # building it under QEMU, which took this job from three minutes to
          # twenty-five — a poor trade for a platform almost nobody runs this
          # on. Release archives still carry an arm64 binary, because those
          # build natively and cost nothing.
          platforms: linux/amd64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            if [[ "${{ needs.prepare.outputs.publish }}" == "true" ]]; then
              echo "### Image pushed"
              echo
              echo '```'
              echo "${IMAGE}:${{ needs.prepare.outputs.version }}"
              echo "${IMAGE}:latest"
              echo '```'
            else
              echo "### Image built, not pushed (branch build)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
