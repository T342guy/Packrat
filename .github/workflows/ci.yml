name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Smoke test the binary
        run: |
          set -euo pipefail
          ./target/release/packrat --db "$RUNNER_TEMP/ci.db" --port 8099 --seed-example &
          server=$!
          trap 'kill $server' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8099/api/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8099/api/health
          # The seeded inventory should be queryable end to end.
          curl -fsS "http://127.0.0.1:8099/api/search?q=tent" | grep -q "4-person tent"
          # And a label sheet should render, QR codes and all.
          curl -fsS "http://127.0.0.1:8099/labels?format=dymo-30334&symbols=both" | grep -q "<svg"
          echo "smoke test passed"

  bench:
    name: Benchmarks
    # Runs on every branch: a regression is worth knowing about while the
    # change is still in progress, not after it lands. Informational rather
    # than a gate — runner timings are too noisy to fail a build on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        run: |
          cargo bench --bench inventory -- --warm-up-time 0.3 --measurement-time 1.0 \
            | tee bench.txt
      - name: Publish the numbers
        run: |
          {
            echo "### Benchmarks"
            echo
            echo '| case | median |'
            echo '| --- | --- |'
            paste -d'|' \
              <(grep -E '^inventory/' bench.txt) \
              <(grep -E '^ +time:' bench.txt | sed 's/.*\[[^ ]* [^ ]* \([^ ]* [^ ]*\) .*/\1/') \
              | sed 's/^/| /; s/|/ | /2; s/$/ |/'
          } >> "$GITHUB_STEP_SUMMARY"
