<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b45309">
<title>Garage Inventory</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<header class="top">
  <div class="top-row">
    <a class="brand" href="#/" title="Garage Inventory">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="10" fill="#b45309"/>
        <path d="M10 18.5 24 12l14 6.5v15L24 40l-14-6.5z" fill="none" stroke="#fff"
              stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M10 18.5 24 25l14-6.5M24 25v15" fill="none" stroke="#fff" stroke-width="2.6"
              stroke-linejoin="round"/>
        <rect x="19" y="27.5" width="10" height="7" rx="1.4" fill="#fff"/>
      </svg>
      <span>Garage Inventory</span>
    </a>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search everything — or type a box code"
             autocomplete="off" spellcheck="false" aria-label="Search the inventory">
      <button class="search-clear" id="search-clear" hidden aria-label="Clear search">&times;</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#/" data-route="home">Overview</a>
    <a href="#/boxes" data-route="boxes">Boxes &amp; places</a>
    <a href="#/items" data-route="items">All items</a>
    <a href="#/labels" data-route="labels">Print labels</a>
    <a href="#/settings" data-route="settings">Settings</a>
  </nav>
</header>

<main id="view"><div class="spinner">Loading your inventory…</div></main>

<button class="fab primary" id="fab">+ Add item</button>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
